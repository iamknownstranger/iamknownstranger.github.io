name: Check Format
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check active portfolio formatting
        run: npx --yes prettier@2.8.8 --check index.html assets/portfolio.css assets/portfolio.js README.md .github/workflows/deploy.yml .github/workflows/prettier.yml
