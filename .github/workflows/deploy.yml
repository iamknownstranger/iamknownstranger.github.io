name: Validate portfolio

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check static site assets and internal links
        run: python3 scripts/validate_portfolio.py
# GitHub Pages publishes master / (root), as configured in repository settings.
# The previous React build to gh-pages targeted a different publishing branch.
